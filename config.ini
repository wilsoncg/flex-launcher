# Flex Launcher v2.2 sample configuration file
# For documentation of these settings, visit: https://complexlogic.github.io/flex-launcher/configuration
[General]
DefaultMenu=Main
VSync=true
#FPSLimit=
#ApplicationTimeout=15
OnLaunch=Blank
WrapEntries=false
ResetOnBack=false
MouseSelect=false
InhibitOSScreensaver=true
#StartupCmd=
#QuitCmd=

[Background]
Mode=Image
#Color=#000000
Image=/usr/share/flex-launcher/assets/mountain-landscape-3840x2160-24317.jpg
#SlideshowDirectory=
#SlideshowImageDuration=30
#SlideshowTransitionTime=3
#ChromaKeyColor=#010101
Overlay=true
OverlayColor=#000000
OverlayOpacity=50%

[Layout]
MaxButtons=4
IconSize=256
IconSpacing=5%
VCenter=50%

[Titles]
Enabled=true
Font=/usr/share/flex-launcher/assets/fonts/OpenSans-Regular.ttf
FontSize=36
Color=#FFFFFF
Opacity=100%
Shadows=false
ShadowColor=#000000
OversizeMode=Shrink
Padding=20

[Highlight]
Enabled=true
FillColor=#FFFFFF
FillOpacity=25%
OutlineSize=0
OutlineColor=#0000FF
OutlineOpacity=100%
CornerRadius=0
VPadding=30
HPadding=30

[Scroll Indicators]
Enabled=true
FillColor=#FFFFFF
OutlineSize=0
OutlineColor=#000000
Opacity=100%

[Clock]
Enabled=true
ShowDate=true
Alignment=Left
Font=/usr/share/flex-launcher/assets/fonts/SourceSansPro-Regular.ttf
FontSize=50
FontColor=#FFFFFF
Shadows=false
ShadowColor=#000000
Margin=5%
Opacity=100%
TimeFormat=24hr
DateFormat=Auto
IncludeWeekday=false

[Screensaver]
Enabled=false
IdleTime=300
Intensity=70%
PauseSlideshow=true

[Hotkeys]
# Esc to quit
Hotkey1=#1B;:quit
# KEY_BACK (browser back)
Hotkey2=#4000011A;:back

[Gamepad]
Enabled=false
DeviceIndex=-1
#ControllerMappingsFile=
LStickX-=:left
LStickX+=:right
#LStickY-=
#LStickY+=
#RStickX-=
#RStickX+=
#RStickY-=
#RStickY+=
#LTrigger=
#RTrigger=
ButtonA=:select
ButtonB=:back
#ButtonX=
#ButtonY=
#ButtonBack=
#ButtonGuide=
#ButtonStart=
#ButtonLeftStick=
#ButtonRightStick=
#ButtonLeftShoulder=
#ButtonRightShoulder=
#ButtonDPadUp=
#ButtonDPadDown=
ButtonDPadLeft=:left
ButtonDPadRight=:right

# Menu configurations
[Main]
#Entry2=Plex;/usr/share/flex-launcher/assets/icons/plex.png;/usr/share/applications/plexmediaplayer.desktop;TVF
Entry1=Waydroid;/usr/share/flex-launcher/assets/icons/Waydroid.png;/usr/share/flex-launcher/waydroid-launcher.sh
Entry2=YouTube;/usr/share/flex-launcher/assets/icons/YouTube.png;/usr/share/flex-launcher/app-launcher.sh youtube
Entry3=Spotify;/usr/share/flex-launcher/assets/icons/spotify.png;/usr/share/flex-launcher/app-launcher.sh spotify
Entry4=Steam;/usr/share/flex-launcher/assets/icons/steam.png;/usr/share/applications/steam.desktop;BigPicture
Entry5=Kodi;/usr/share/flex-launcher/assets/icons/kodi.png;/usr/share/flex-launcher/kodi-launcher.sh
Entry6=Jellyfin;/usr/share/flex-launcher/assets/icons/jellyfin.png;/usr/share/flex-launcher/jellyfin-webapp.sh
Entry7=ES;/usr/share/flex-launcher/assets/icons/es-de.png;/usr/share/flex-launcher/emulation-station.sh
Entry8=System;/usr/share/flex-launcher/assets/icons/computer.png;:submenu System

[System]
Entry1=Power;/usr/share/flex-launcher/assets/icons/power-settings.png;:submenu PowerSettings
Entry2=Kill;/usr/share/flex-launcher/assets/icons/error.png;:submenu Kill
Entry3=Night Light;/usr/share/flex-launcher/assets/icons/toggle-night-light.png;:submenu NightLight
Entry4=Audio;/usr/share/flex-launcher/assets/icons/audio-settings.png;:submenu ToggleAudio
Entry5=HDR Settings;/usr/share/flex-launcher/assets/icons/settings-brightness.png;:submenu ToggleHdr
Entry6=Back;/usr/share/flex-launcher/assets/icons/menu-back.png;:back

[Kill]
Entry1=Close Waydroid;/usr/share/flex-launcher/assets/icons/Waydroid.png;:fork /usr/share/flex-launcher/kill-script-waydroid.sh
Entry2=Close Jellyfin;/usr/share/flex-launcher/assets/icons/jellyfin.png;:fork /usr/share/flex-launcher/kill-script-jellyfin-webapp.sh
Entry3=Close ES;/usr/share/flex-launcher/assets/icons/es-de.png;:fork /usr/share/flex-launcher/kill-script-emulation-station.sh
Entry4=Close Steam;/usr/share/flex-launcher/assets/icons/steam.png;:fork /usr/share/flex-launcher/kill-script-steam-shutdown.sh
Entry5=Back;/usr/share/flex-launcher/assets/icons/menu-back.png;:back

[PowerSettings]
Entry1=Shutdown;/usr/share/flex-launcher/assets/icons/system.png;:shutdown
Entry2=Restart;/usr/share/flex-launcher/assets/icons/restart.png;:restart
Entry3=Sleep;/usr/share/flex-launcher/assets/icons/sleep.png;:sleep
Entry4=Back;/usr/share/flex-launcher/assets/icons/menu-back.png;:back

[NightLight]
Entry1=Toggle;/usr/share/flex-launcher/assets/icons/toggle-night-light.png;:fork /usr/share/flex-launcher/toggle-night-light.sh
Entry2=Back;/usr/share/flex-launcher/assets/icons/menu-back.png;:back

[ToggleAudio]
Entry1=Analog;/usr/share/flex-launcher/assets/icons/speaker.png;:fork /usr/share/flex-launcher/toggle-audio.sh analog
Entry2=Hdmi;/usr/share/flex-launcher/assets/icons/tv.png;:fork /usr/share/flex-launcher/toggle-audio.sh hdmi
Entry3=Q45;/usr/share/flex-launcher/assets/icons/headphones.png;:fork /usr/share/flex-launcher/toggle-audio.sh q45
Entry4=Back;/usr/share/flex-launcher/assets/icons/menu-back.png;:back

[ToggleHdr]
Entry1=Hdr on;/usr/share/flex-launcher/assets/icons/hdr-on.png;:fork /usr/share/flex-launcher/toggle-sdr-hdr.sh hdr
Entry2=Hdr off;/usr/share/flex-launcher/assets/icons/hdr-off.png;:fork /usr/share/flex-launcher/toggle-sdr-hdr.sh sdr
Entry3=Back;/usr/share/flex-launcher/assets/icons/menu-back.png;:back
